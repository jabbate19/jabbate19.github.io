name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build:tokens

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            biber \
            latexmk

      - name: Compile resume
        working-directory: resume
        run: latexmk -pdf -interaction=nonstopmode -outdir=build resume.tex

      - name: Build website
        run: npm run build -w website-v2

      - name: Copy resume to site
        run: |
          cp resume/build/resume.pdf website-v2/dist/resume.pdf
          # SPA fallback for client-side routing (BrowserRouter on GitHub Pages)
          cp website-v2/dist/index.html website-v2/dist/404.html
          touch website-v2/dist/.nojekyll
          echo "dist + resume copied:"
          ls -lh website-v2/dist/resume.pdf website-v2/dist/index.html website-v2/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
