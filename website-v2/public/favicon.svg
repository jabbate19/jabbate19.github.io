<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JA">
<title>JA — Joe Abbate</title>
<!-- palette: bg #0a1628 / border #1e335c / fg #e6eaf2 / accent #3b82f6 — matches tokens.json -->
<rect class="bg" width="32" height="32" rx="8" fill="#0a1628"/>
<rect class="bd" x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#1e335c" stroke-opacity="1"/>
<!-- JA — Inter 700, tight tracking like wordmark; text keeps it crisp at 16px, no paths needed -->
<text class="fg" x="15.2" y="22.1" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.8" font-weight="740" letter-spacing="-0.06em" fill="#e6eaf2">JA</text>
<!-- wordmark dot: 6px @ 15px type → ~2.1px @ 32px icon, with soft glow -->
<g opacity="1">
  <circle cx="24.85" cy="8.2" r="2.15" fill="#3b82f6"/>
  <circle cx="24.85" cy="8.2" r="3.6" fill="#3b82f6" opacity="0.18"/>
</g>
</svg>
